<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="英语口语情景对话生成器 · 离线可用的少儿英语口语互动练习 App" />
  <title>英语口语情景对话</title>
  <!-- PWA 清单：用 .json 而非 .webmanifest，避免部分免费静态托管没有 .webmanifest 的
       MIME 映射（按 octet-stream 下发）导致清单解析失败、安装入口消失 -->
  <link rel="manifest" href="manifest.json" />
  <!-- 图标必须是 PNG 位图（192/512），仅 SVG 过不了 Chrome 可安装性校验；
       apple-touch-icon iOS 完全不支持 SVG，必须 PNG，否则添加到主屏幕后是白板 -->
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <!-- iOS 添加到主屏幕后以独立 App（无浏览器框）模式运行 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="口语情景" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="js/data.js"></script>
  <script src="js/partner.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/mic-permission.js"></script>
  <script src="js/llm.js"></script>
  <script src="js/install.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
