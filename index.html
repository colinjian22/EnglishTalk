  <style>
/* ===================== 英语口语情景对话 APK 样式 ===================== */
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --blue:#2563eb; --blue-d:#1d4ed8; --green:#16a34a; --rose:#e11d48; --amber:#d97706;
  --chip:#eef2ff; --shadow:0 2px 10px rgba(30,41,59,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
#app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}

/* 顶栏 */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.iconbtn{background:none;border:none;color:var(--blue);font-size:15px;cursor:pointer;padding:6px 4px}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-size:26px}
.t1{font-weight:700;font-size:16px}
.t2{font-size:11px;color:var(--sub)}

/* 底部导航 */
.tabbar{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:19}
.tab{flex:1;border:none;background:none;padding:12px 4px;font-size:14px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}

.view{flex:1;padding:16px 14px 24px;padding-bottom:max(24px,env(safe-area-inset-bottom))}

/* 状态栏 */
.statusbar{font-size:11px;color:var(--sub);text-align:center;padding:6px;border-top:1px solid var(--line);background:#fff}

/* 通用区块 */
.sec{font-size:15px;margin:18px 2px 10px;color:var(--ink)}
.hint{color:var(--sub);font-size:13px;margin:4px 0 14px}
.empty{color:var(--sub);padding:30px;text-align:center}
.tip{margin-top:18px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 12px;border-radius:10px;font-size:13px}

/* 首页 hero */
.hero{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border-radius:16px;padding:22px 18px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 8px;font-size:21px}
.hero p{margin:0 0 16px;opacity:.92;font-size:14px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:11px 16px;font-size:14px;cursor:pointer;background:var(--chip);color:var(--blue-d);font-weight:600}
.btn.primary{background:#fff;color:var(--blue-d)}
.btn.small{padding:8px 12px;font-size:13px}
.hero .btn{background:rgba(255,255,255,.18);color:#fff}
.hero .btn.primary{background:#fff;color:var(--blue-d)}

/* 类别网格 */
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.catcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.catcard:active{transform:scale(.98)}
.cat-zh{font-size:16px;font-weight:700}
.cat-en{font-size:11px;color:var(--sub);margin-top:2px}
.cat-n{font-size:11px;color:var(--blue);margin-top:8px}

/* 情景库 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--sub)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sclist{display:grid;gap:10px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.scard:active{transform:scale(.99)}
.sc-top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.sc-title{font-size:16px;font-weight:700}
.sc-en{font-size:12px;color:var(--sub)}
.sc-meta{font-size:11px;color:var(--blue);margin-top:6px}
.tag{background:var(--chip);color:var(--blue-d);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600}
.tag2{background:#fef3c7;color:var(--amber);border-radius:6px;padding:2px 8px;font-size:11px}
.lvl{background:#dcfce7;color:var(--green);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600}

/* 详情 */
.detail .d-head{margin-bottom:12px}
.d-head h1{margin:0;font-size:20px}
.d-en{color:var(--sub);font-size:13px;margin-top:2px}
.d-tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.block h3{margin:0 0 10px;font-size:15px;color:var(--blue-d)}
.kv{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--sub);min-width:78px;flex-shrink:0}
.kv b{font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--chip);color:var(--blue-d)}
.tbl code{background:#f1f5f9;border-radius:5px;padding:1px 5px;font-size:12px}
.tbl .zh{color:var(--sub)}
.rolewrap{display:grid;grid-template-columns:1fr;gap:10px}
.rolecard{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px}
.role-name{font-weight:700;color:var(--blue-d);margin-bottom:6px}
.rolecard ul{margin:0;padding-left:18px;font-size:13px}
.demo{display:flex;flex-direction:column;gap:8px}
.demo-line{background:#f8fafc;border-radius:10px;padding:9px 11px;position:relative}
.demo-line .who{font-weight:700;font-size:12px;margin-right:6px}
.demo-line .who.a{color:var(--blue)}
.demo-line .who.b{color:var(--rose)}
.demo-line .en{font-size:14px}
.demo-line .zh{color:var(--sub);font-size:12px}
.mini-speak{border:none;background:#eef2ff;color:var(--blue);border-radius:6px;padding:2px 7px;cursor:pointer;font-size:12px;margin-left:6px}
.tabs3{display:flex;gap:6px;margin-bottom:8px}
.t3{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--sub)}
.t3.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.t3body{background:#f8fafc;border-radius:10px;padding:11px;font-size:14px}
.stuck{padding-left:20px;margin:0;font-size:13px}
.stuck li{padding:3px 0}
.solo{padding-left:18px;margin:0;font-size:13px}
.callout{background:#f8fafc;border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px;font-size:14px}
.callout.ok{border-left-color:var(--green)}
.tbl .ok{color:var(--green)}
.tbl .need{color:var(--rose)}

/* 生成器 */
.form{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--sub);font-weight:600}
.form select,.form input[type=text]{padding:10px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink)}
.form input[type=checkbox]{width:18px;height:18px;align-self:flex-start}
.gen-banner{margin-top:14px;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:12px;padding:12px;font-size:14px;display:flex;align-items:center;gap:10px;justify-content:space-between}

/* 练习 */
.practice{display:flex;flex-direction:column;height:calc(100vh - 150px)}
.p-head{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.p-title{font-weight:700;font-size:15px}
.p-sub{font-size:12px;color:var(--sub);margin-top:3px}
.p-sub b{color:var(--blue-d)}
.p-roles{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.p-roles summary{cursor:pointer;font-weight:600;color:var(--blue-d)}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.msg{position:relative;max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px}
.msg .who{font-size:11px;color:var(--sub);margin-bottom:2px}
.msg .en{font-size:14px;line-height:1.5}
.msg .zh{font-size:12px;color:var(--sub);margin-top:3px}
.msg .mini-speak{position:absolute;top:6px;right:6px}
.msg.app{align-self:flex-start;background:#eef2ff;border-bottom-left-radius:4px}
.msg.you{align-self:flex-end;background:#dcfce7;border-bottom-right-radius:4px;text-align:right}
.msg.you .zh{text-align:right}
.suggest{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px}
.s-label{color:var(--amber);font-weight:600;margin-bottom:4px}
.s-body{font-size:14px;font-weight:600;cursor:pointer}
.s-zh{color:var(--sub);font-size:12px;margin-top:2px}
.composer{display:flex;gap:8px;margin-top:10px}
.composer input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px}
.mic{border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;font-size:18px;cursor:pointer}
.mic.rec{background:var(--rose);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
.p-actions{display:flex;gap:8px;margin-top:8px}
.done-banner{background:#dcfce7;border:1px solid #86efac;color:#065f46;border-radius:10px;padding:10px;margin-top:10px;font-size:14px;text-align:center}

/* 生成模式切换 */
.genmode{display:flex;gap:8px;margin:4px 0 12px}
.gm{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;font-size:14px;cursor:pointer;color:var(--sub)}
.gm.on{background:var(--blue-d);color:#fff;border-color:var(--blue-d);font-weight:600}
#genCloud{margin-top:6px}
.form .full{width:100%;flex-basis:100%}
.form label.full{display:flex;flex-direction:column;gap:5px}
.form textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;resize:vertical;box-sizing:border-box}
.form .row{display:flex;gap:8px;flex-wrap:wrap}
.form .row .btn{flex:1}
input[type=range]{width:100%}
.gen-loading{margin-top:14px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:12px;padding:12px;font-size:14px}
.gen-err{margin-top:14px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:12px;font-size:14px;line-height:1.5}

/* ===== 年级体系 ===== */
.gradegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:4px}
.gradecard{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;cursor:pointer;transition:.15s}
.gradecard:hover{border-color:var(--blue);transform:translateY(-2px)}
.gradecard.feat{border-color:#f59e0b;background:#fffbeb;box-shadow:0 2px 10px rgba(245,158,11,.15)}
.gd-name{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gd-new{font-size:11px;font-weight:600;background:#f59e0b;color:#fff;border-radius:999px;padding:1px 7px}
.gd-en{font-size:12px;color:var(--sub);margin-top:3px}
.gd-n{font-size:12px;color:var(--blue-d);margin-top:5px;font-weight:600}
.gd-topic{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.4}
.gchips{margin-top:8px;flex-wrap:wrap}
.grade-note{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:10px}
.g3badge{display:inline-block;font-size:10px;font-weight:700;background:#f59e0b;color:#fff;border-radius:999px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.scard.is-g3{border-color:#fcd34d}
.sc-book{font-size:11px;color:#92400e;margin-top:5px;background:#fffbeb;border-radius:6px;padding:3px 6px;display:inline-block}

/* 本地文件模式（file://）下的环境提示 */
.tip.warn{background:#fffbeb;border:1px solid #fde68a;color:#78350f;line-height:1.6}

</style>
</head>
<body>
  <div id="app"></div>
<script>
/* ===== js/data.js ===== */
/* =========================================================================
 * data.js — 英语口语情景对话生成器 数据层
 * 来源 Skill: eduai-speaking-scenario-dialogue
 * 包含：类别 / 交际功能 / 分级参数 / 情景库(完整12节) / 生成插槽题库
 * 所有内容均为离线内置，无需联网即可运行。
 * ========================================================================= */

/* ---------- 1. 七大情景类别 ---------- */
const CATEGORIES = [
  { id: 'campus',    zh: '校园',        en: 'Campus' },
  { id: 'interest',  zh: '兴趣与朋友',  en: 'Interests & Friends' },
  { id: 'foodshop',  zh: '餐厅与购物',  en: 'Restaurant & Shopping' },
  { id: 'travel',    zh: '旅行与社区',  en: 'Travel & Community' },
  { id: 'festival',  zh: '节日与文化',  en: 'Festivals & Culture' },
  { id: 'family',    zh: '家庭与日常',  en: 'Family & Daily Life' },
  { id: 'task',      zh: '任务原型',    en: 'Task Patterns' },
];

/* ---------- 2. 交际功能（一次聚焦一个） ---------- */
const FUNCTIONS = [
  '询问信息', '表达偏好', '邀请与回应', '请求与提供帮助',
  '选择并说明理由', '比较与推荐', '计划与协商', '描述与确认',
  '购买与点餐', '问路与指路', '解决简单问题',
];

/* ---------- 3. 难度分级（S1–S5） ---------- */
const LEVELS = {
  S1: { zh: 'S1 模仿表达', rounds: '2–4轮',  frames: '图片 + 完整句框', corePatterns: 1, newWords: '≤4', require: '指认、选择、短答' },
  S2: { zh: 'S2 句框表达', rounds: '4–6轮',  frames: '句框 + 词槽',     corePatterns: 1, newWords: '≤6', require: '准备后表达，至少提问一次' },
  S3: { zh: 'S3 互动表达', rounds: '6–8轮',  frames: '只看关键词',     corePatterns: 2, newWords: '≤8', require: '回答后补充信息，至少一次追问/回应' },
  S4: { zh: 'S4 连续表达', rounds: '8–12轮', frames: '理由 + 比较',     corePatterns: 2, newWords: '≤10', require: '角色目标不同，中途改变一个条件' },
  S5: { zh: 'S5 迁移表达', rounds: '无脚本',  frames: '整合多信息',     corePatterns: 3, newWords: '≤12', require: '主动澄清、协商、总结' },
};

/* ---------- 3b. 年级画像（决定情景的语言上限） ----------
 * levels      : 该年级建议使用的 S 级区间
 * defaultLevel: 生成时默认难度
 * 三年级为多数地区英语“起点年”，语言必须压到最低，
 * 因此单独给出词表、句型白名单与明令禁止项。
 */
const GRADES = {
  g3: {
    id: 'g3', zh: '小学三年级', en: 'Grade 3', age: '8–9岁',
    start: '英语起步年（多数地区三年级起点），以听说为主、不要求书写长句',
    levels: ['S1', 'S2'], defaultLevel: 'S1',
    rounds: '2–4轮（挑战不超过 6 轮）',
    sentence: '每句 ≤ 6–8 个词，只用 be 动词与一般现在时',
    newWords: '≤4',
    vocab: '限于 PEP 三上/三下词表（约 200 词）',
    zhSupport: '高：每句配中文，允许先看示范跟读、允许指认与短答',

function bankFor(gradeId, key) {
  if (gradeId === 'g3') {
    const hit = BANKS['g3' + key] ||
                BANKS['g3' + key.charAt(0).toUpperCase() + key.slice(1)];
    if (hit && hit.length) return hit;
  }
  return BANKS[key] || [];
}

/* 把字符串里的 {slot} 用 scenario.slots 替换 */
function fillSlots(text, slots) {
  if (!text || !slots) return text;
  return text.replace(/\{([a-zA-Z0-9_]+)\}/g, (m, k) => (slots[k] !== undefined ? slots[k] : m));
}

/* =========================================================================
 * partner.js — 离线 AI 角色对话引擎
 * 不依赖任何云端 API。基于情景 partner 字段中的角色事实 / 问题 / 澄清模板，
 * 用轻量意图识别驱动“信息差”式逐轮对话：学生问→应用答→应用追问→达成共识。
 * ========================================================================= */

(function (global) {
  'use strict';

  const QUESTION_WORDS = ['what', 'when', 'where', 'which', 'how', 'why', 'who', 'do you', 'are you', 'can you', 'is it', 'did you'];
  const AGREE_WORDS   = ['ok', 'okay', 'sure', 'deal', "let's", 'agree', 'yes', 'great', 'good', 'works', 'fine', 'love to'];
  const DISAGREE_WORDS= ['no', 'cannot', "can't", 'sorry', 'don\'t', 'wont', 'won\'t', 'not', 'busy', 'another'];
  const CLARIFY_WORDS = ['again', 'repeat', 'pardon', 'slow', 'what?', 'huh', '?', 'which one', 'what do you mean'];

  function norm(s) { return (s || '').toLowerCase().replace(/[?.,!]/g, ' ').trim(); }

  function hasAny(text, list) { return list.some(w => text.includes(w)); }

  class Partner {
    constructor(scenario) {
      this.sc = scenario;
      const p = scenario.partner || {};
      const slots = scenario.slots || {};
      // 预填充插槽
      this.appRole = p.appRole || 'B';
      this.facts = (p.appFacts || []).map(f => ({
        triggers: f.triggers, say: fillSlots(f.say, slots), zh: fillSlots(f.zh || '', slots),
      }));
      this.questions = (p.appQuestions || []).map(q => ({
        ask: fillSlots(q.ask, slots), zh: fillSlots(q.zh || '', slots),
      }));
      this.clarify = (p.clarify || []).map(c => ({
        triggers: c.triggers, say: fillSlots(c.say, slots), zh: fillSlots(c.zh || '', slots),
      }));
      this.tpl = {
        agree: fillSlots(p.agree || "That works! Let's do it.", slots),
        disagree: fillSlots(p.disagree || "Sorry, I can't. Let's try another way.", slots),
        decide: fillSlots(p.decide || "Great, we have a plan!", slots),
      };
      this.qIndex = 0;
      this.factUsed = new Set();
      this.done = false;
      this.turn = 0;
    }

    /* 开场：应用先发起 */
    start() {
      this.turn = 0;
      if (this.questions.length) {
        const q = this.questions[0];
        this.qIndex = 1;
        return { en: q.ask, zh: q.zh, suggest: '', suggestZh: '（你是' + this.otherRole() + '，请回应上面的提问）', done: false, opener: true };
      }
      return { en: this.tpl.agree, zh: '', suggest: '', suggestZh: '', done: false, opener: true };
    }

    otherRole() { return this.appRole === 'B' ? 'A' : 'B'; }

    /* 学生说了一句，返回应用的回应 */
    respond(userText) {
      this.turn++;
      const t = norm(userText);

      // 1) 澄清请求
      if (hasAny(t, CLARIFY_WORDS)) {
        const c = this.clarify.find(c => hasAny(t, c.triggers));
        if (c) return this.wrap(c.say, c.zh, this.askNext('（没听清，请再说一次或换种说法）'));
        // 通用澄清
        return this.wrap("Could you say that again, please?", "能再说一遍吗？", this.askNext('（请重复或换种说法）'));
      }

      // 2) 学生在提问 → 应用给出对应事实
      const isQuestion = t.includes('?') || hasAny(t, QUESTION_WORDS);
      if (isQuestion) {
        const fact = this.facts.find(f => !this.factUsed.has(this.facts.indexOf(f)) && hasAny(t, f.triggers));
        if (fact) {
          const idx = this.facts.indexOf(fact);
          this.factUsed.add(idx);
          return this.wrap(fact.say, fact.zh, this.askNext('（根据对方的回答，继续提问或做决定）'), idx);
        }
        // 没匹配到事实：礼貌回应并回到当前问题
        return this.wrap("Hmm, I'm not sure. " + (this.questions[Math.min(this.qIndex, this.questions.length - 1)]?.ask || this.tpl.agree),
          "嗯，我不太确定。/" + (this.questions[Math.min(this.qIndex, this.questions.length - 1)]?.zh || ''),
          this.askNext('（换种方式再问一次）'));
      }

      // 3) 学生表态：同意 / 决定
      if (hasAny(t, AGREE_WORDS)) {
        if (this.qIndex >= this.questions.length && this.factUsed.size > 0) {
          this.done = true;
          return this.wrap(this.tpl.decide, '（达成共识！）', '（任务完成 🎉 你可以点击“重新开始”换一题）', true);
        }
        return this.wrap(this.tpl.agree, '（同意）', this.askNext('（继续推进，或确认最终安排）'));
      }

      // 4) 学生拒绝 / 提条件
      if (hasAny(t, DISAGREE_WORDS)) {
        // 看看有没有能回应的“限制类”事实（如 sold out / busy / test）
        const fact = this.facts.find(f => !this.factUsed.has(this.facts.indexOf(f)) && /sold|busy|test|occup|river|wrong|can't|cant/.test(f.triggers.join(' ')));
        if (fact) {
          const idx = this.facts.indexOf(fact); this.factUsed.add(idx);
          return this.wrap(fact.say, fact.zh, this.askNext('（根据新情况调整你的方案）'));
        }
        return this.wrap(this.tpl.disagree, '（不同意/有难处）', this.askNext('（提出你的替代方案或理由）'));
      }

      // 5) 默认：鼓励并继续追问
      return this.wrap("OK. " + (this.questions[Math.min(this.qIndex, this.questions.length - 1)]?.ask || this.tpl.agree),
        "好的。/" + (this.questions[Math.min(this.qIndex, this.questions.length - 1)]?.zh || ''),
        this.askNext('（继续对话，试着提问或做决定）'));
    }

    /* 取出下一个要问的问题（若有），否则给决定提示 */
    askNext(fallbackZh) {
      if (this.qIndex < this.questions.length) {
        const q = this.questions[this.qIndex++];
        return { suggest: q.akHint || q.ask, suggestZh: q.zh, fallback: false };
      }
      return { suggest: this.tpl.decide, suggestZh: '（你们可以确认最终安排了）', fallback: true };
    }

    wrap(en, zh, next, done) {
      return {
        en: en,
        zh: zh,
        suggest: next ? next.suggest : '',
        suggestZh: next ? next.suggestZh : '',
        done: !!done || this.done,
      };
    }
  }

  global.Partner = Partner;
  if (typeof module !== 'undefined' && module.exports) module.exports = { Partner };
})(typeof window !== 'undefined' ? window : globalThis);

(function (global) {

  const TTS = global.speechSynthesis || null;
  const SR = global.SpeechRecognition || global.webkitSpeechRecognition || null;

  const Speech = {
    ttsAvailable: !!TTS,
    sttAvailable: !!SR,

    /* 朗读英文（或指定语言） */
    speak(text, opts) {
      opts = opts || {};
      if (!TTS) { console.warn('TTS 不可用'); return false; }
      try {
        TTS.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = opts.lang || 'en-US';
        u.rate = opts.rate || 0.95;
        u.pitch = opts.pitch || 1;
        TTS.speak(u);
        return true;
      } catch (e) { console.warn('speak error', e); return false; }
    },

    cancel() { if (TTS) try { TTS.cancel(); } catch (e) {} },

    /* 开始听写，回调 {onResult, onError, onEnd}
     * 若运行环境提供了 MicPermission（Cordova APK），会先申请麦克风权限，
     * 授权成功才启动识别；非 Cordova 环境（浏览器 / 单文件版）直接启动。 */
    listen(callbacks) {
      callbacks = callbacks || {};
      const start = () => {
        if (!SR) { callbacks.onError && callbacks.onError('STT 不可用：当前浏览器不支持语音识别。可改用键盘输入。'); return null; }
        try {
          const rec = new SR();
          rec.lang = 'en-US';
          rec.interimResults = false;
          rec.maxAlternatives = 1;
          rec.continuous = false;
          rec.onresult = (ev) => {
            const txt = ev.results && ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : '';
            callbacks.onResult && callbacks.onResult(txt);
          };
          rec.onerror = (ev) => { callbacks.onError && callbacks.onError(ev.error || '识别错误'); };
          rec.onend = () => { callbacks.onEnd && callbacks.onEnd(); };
          rec.start();
          return rec;
        } catch (e) { callbacks.onError && callbacks.onError(e.message || '启动识别失败'); return null; }
      };

      const mp = global.MicPermission;
      if (mp && typeof mp.ensure === 'function') {
        mp.ensure().then((ok) => {
          if (ok) { start(); }
          else { callbacks.onError && callbacks.onError('麦克风权限未授权：请在系统设置中允许本应用使用麦克风，或改用键盘输入。'); }
        });
        return null; // 异步启动
      }
      return start();
    },
  };

  global.Speech = Speech;
  if (typeof module !== 'undefined' && module.exports) module.exports = { Speech };
})(typeof window !== 'undefined' ? window : globalThis);

/* =========================================================================
 * mic-permission.js — 运行时麦克风权限申请（Cordova APK 专用）
 *
 * 为什么需要它：
 *   Android 6+（本项目 targetSdk 34）把 RECORD_AUDIO 列为「危险权限」，
 *   仅写在 AndroidManifest 里不够，必须在运行时弹窗向用户申请。
 *   在 Cordova WebView 中，Web Speech API 的语音识别不会自动触发原生
 *   权限弹窗（部分 ROM 会，但不可靠），所以需要显式用原生插件申请。
 *
 * 行为：
 *   - 普通浏览器 / file:// 单文件版：浏览器自己管权限，直接放行（resolve true）。
 *   - Cordova Android：用 cordova-plugin-android-permissions 动态申请 RECORD_AUDIO。
 *   - Cordova iOS：用同一插件的 MICROPHONE 常量，配合 Info.plist 的
 *     NSMicrophoneUsageDescription 描述触发系统授权。
 * ========================================================================= */
(function (global) {
  'use strict';

  function hasCordovaPerm() {
    return !!(global.cordova && global.cordova.plugins && global.cordova.plugins.permissions);
  }

  function platformIsIOS() {
    try {
      if (global.cordova && global.cordova.platformId === 'ios') return true;
      if (global.device && /iPhone|iPad|iPod/i.test(global.device.platform || '')) return true;
    } catch (e) {}
    return false;
  }

  /* 申请麦克风权限，返回 Promise<boolean>（true = 已授权）。
   * 非 Cordova 环境直接 resolve(true)，不影响任何功能。 */
  function ensure() {
    return new Promise((resolve) => {
      if (!hasCordovaPerm()) { resolve(true); return; }

      const perms = global.cordova.plugins.permissions;
      let perm;
      try {
        perm = platformIsIOS() ? perms.MICROPHONE : perms.RECORD_AUDIO;
      } catch (e) { perm = perms.RECORD_AUDIO; }
      if (!perm) { resolve(true); return; }

      // 先查是否已授权
      perms.checkPermission(perm, (status) => {
        if (status && status.hasPermission) { resolve(true); return; }
        // 未授权 → 弹窗申请
        perms.requestPermission(perm,
          (s2) => resolve(!!(s2 && s2.hasPermission)),
          (err) => {
            // 部分 ROM 申请被拒或走系统设置，视为未授权，交给上层引导
            console.warn('[MicPermission] 申请失败/被拒：', err);
            resolve(false);
          }
        );
      }, (err) => {
        console.warn('[MicPermission] 检查失败：', err);
        resolve(false);
      });
    });
  }

  /* 跳转到系统设置页（插件支持时），否则用 alert 引导手动开启。 */
  function openSettings() {
    try {
      if (hasCordovaPerm()) {
        const perms = global.cordova.plugins.permissions;
        if (typeof perms.switchToSettings === 'function') {
          perms.switchToSettings(() => {}, () => {});
          return;
        }
      }
    } catch (e) {}
    if (global.alert) {
      global.alert('请在系统「设置 → 应用 → 英语口语情景对话 → 权限」中开启麦克风（录音）权限，即可使用语音输入。');
    }
  }

  global.MicPermission = MicPermission;

})(typeof window !== 'undefined' ? window : globalThis);

    let base = (s.base && s.base.trim()) ? s.base.trim().replace(/\/+$/, '') : (PROVIDERS[s.provider] && PROVIDERS[s.provider].base);
    if (!base) { const e = new Error('未配置接口地址（Base URL）'); e.code = 'NO_BASE'; throw e; }
    let model = (s.model && s.model.trim()) ? s.model.trim() : (PROVIDERS[s.provider] && PROVIDERS[s.provider].model);
    if (!model) { const e = new Error('未配置模型名称'); e.code = 'NO_MODEL'; throw e; }

    const temperature = (typeof s.temperature === 'number') ? s.temperature : 0.8;
    const body = {
      model: model,
      messages: [
        { role: 'system', content: SYSTEM_PROMPT },
        { role: 'user', content: buildUserPrompt(opts || {}) },

      resp = await fetch(base + '/chat/completions', {
        method: 'POST',

        body: JSON.stringify(body),

      e.code = 'NETWORK';

  function onCloudGenerate() {
    const out = $('#genOut');
    const s = LLM.loadSettings();
    if (!s.apiKey) {
      out.innerHTML = `<div class="gen-err">⚠️ 尚未配置 API Key。请先点「⚙ 设置密钥/接口」填入你的密钥。</div>`;
      return;
    }
    out.innerHTML = `<div class="gen-loading">🤖 大模型创作中…（可能需要十几秒，请稍候）</div>`;
    const opts = {
      category: $('#cCat').value,
      func: $('#cFunc').value,
      level: $('#cLvl').value,
      grade: $('#cGrade').value,
      prompt: $('#cPrompt').value,
    };
    LLM.generate(opts).then(sc => {
      showGenerated(sc, 'gen');
      if (window.Speech && Speech.speak) Speech.speak('Scenario generated.');
    }).catch(err => {
      const code = err && err.code;
      let msg = esc(err.message || String(err));
      if (code === 'NO_KEY') msg = '尚未配置 API Key，请先设置。';
      else if (code === 'NETWORK') msg = '网络请求失败：请确认设备已联网，且接口地址允许浏览器跨域（CORS）。打包成 APK 时本工程已放开网络权限。';
      else if (code && code.indexOf('HTTP_') === 0) msg = '接口返回错误：' + msg + '（请检查 API Key / 模型名 / 账户额度）';
      out.innerHTML = `<div class="gen-err">⚠️ 生成失败：${msg}</div>`;
    });
  }

  function generateScenario(opts) {
    /* 年级约束：① 优先从该年级情景中挑模板 ② 难度钳制在该年级区间 */
    const g = (opts.grade && opts.grade !== 'all') ? opts.grade : null;
    const G = g ? GRADES[g] : null;
    let level = opts.level;
    if (G && G.levels.indexOf(level) < 0) level = G.defaultLevel;

    let pool = SCENARIOS.filter(s => opts.category === 'all' || s.category === opts.category);
    if (g) {
      const gp = pool.filter(s => matchGrade(s, g));
      if (gp.length) pool = gp;      // 该年级有可用模板就用它，否则退回全池
    }
    // 优先选同功能的 base，否则随机
    let base = pool.find(s => s.func === opts.func) || pick(pool);
    // 先构造一份带随机化的 slots，再整体填充（确保随机值真正落到输出里）
    const randSlots = Object.assign({}, base.slots || {});
    const nameBank = g ? bankFor(g, 'names') : BANKS.names;
    randSlots.nameA = pick(nameBank);
    randSlots.nameB = pick(nameBank.filter(n => n !== randSlots.nameA));
    randSlots.act = pick(BANKS.activities);
    const copy = JSON.parse(JSON.stringify(base));
    copy.slots = randSlots;            // 写入随机化后的 slots
    const sc = deepFill(copy, randSlots);
    sc.level = level;
    sc.tasks = buildTasksByLevel(sc, level);
    if (opts.twist) sc.setting.constraints += '；情境变化：' + pick(BANKS.twists) + '。';

    if (G) {
      sc.grade = g;
      sc.grades = G.zh;
      // 模板不属于该年级（降级兜底）时，统一改用该年级的教材标注
      if (!matchGrade(base, g)) sc.textbook = G.textbook;
      sc.setting.constraints += `；【${G.zh}语言约束】${G.sentence}，生词${G.newWords}，${G.rounds}。避免：${G.avoid.join('、')}。`;
    }
    sc.generated = true;
    return sc;
  }

  function buildTasksByLevel(scn, level) {
    const L = LEVELS[level];
    const task = (scn.setting && scn.setting.task) || '';
    return {
      basic: `【${L.zh}·保底】${task} 提供图片/句框，完成 ${L.rounds} 基本互动，允许先看示范。`,
      standard: `【${L.zh}·标准】只看关键词与半开放句框，完成 ${L.rounds} 互动，至少提问并回应一次。新词≤${L.newWords}。`,
      challenge: `【${L.zh}·挑战】去掉多数句框，增加一项限制或临场变化，要求给出理由、追问或复述对方信息。`,
    };
  }

          <button class="btn primary" id="sendBtn">发送</button>
        </div>

      </div>`;

    state.partner = new Partner(sc);
    const chat = $('#chat');
    let lastAppLine = '';

    function addMsg(who, en, zh) {
      const m = document.createElement('div');
      m.className = 'msg ' + (who === 'app' ? 'app' : 'you');
      const w = document.createElement('div'); w.className = 'who'; w.textContent = who === 'app' ? 'AI（角色' + appRole + '）' : '你（角色' + otherRole + '）';
      const e = document.createElement('div'); e.className = 'en'; e.textContent = en;
      m.appendChild(w); m.appendChild(e);
      if (zh) { const z = document.createElement('div'); z.className = 'zh'; z.textContent = zh; m.appendChild(z); }
      const sp = document.createElement('button'); sp.className = 'mini-speak'; sp.textContent = '🔊';
      sp.addEventListener('click', () => window.Speech && Speech.speak(en));
      m.appendChild(sp);
      chat.appendChild(m);
      chat.scrollTop = chat.scrollHeight;
    }

    function showSuggest(s) {
      const box = $('#suggest');
      if (s && s.suggest) {
        $('#sEn').textContent = s.suggest; $('#sZh').textContent = s.suggestZh || '';
        box.hidden = false;
        $('#sSpeak').onclick = () => window.Speech && Speech.speak(s.suggest);
      } else box.hidden = true;
    }

    function appSay(res) {
      addMsg('app', res.en, res.zh);
      lastAppLine = res.en;
      window.Speech && Speech.speak(res.en);
      showSuggest(res);
      if (res.done) $('#doneBanner').hidden = false;
    }

    function userSend(text) {
      if (!text || !text.trim()) return;
      addMsg('you', text.trim(), '');
      const res = state.partner.respond(text);
      setTimeout(() => appSay(res), 350);
    }

    // 开场
    const opening = state.partner.start();
    setTimeout(() => appSay(opening), 300);

    $('#sendBtn').addEventListener('click', () => {
      const v = $('#userInput').value; $('#userInput').value = ''; userSend(v);
    });
    $('#userInput').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = $('#userInput').value; $('#userInput').value = ''; userSend(v); } });
    $('#replayBtn').addEventListener('click', () => { if (lastAppLine) window.Speech && Speech.speak(lastAppLine); });
    $('#restartBtn').addEventListener('click', () => renderPractice(sc));
    $('#sEn') && $('#sEn').addEventListener('click', () => { const t = $('#sEn').textContent; if (t) $('#userInput').value = t; });

    const mic = $('#micBtn');
    if (!(window.Speech && Speech.sttAvailable)) { mic.disabled = true; mic.title = '当前浏览器不支持语音识别，可用键盘输入'; }
    mic.addEventListener('click', () => {
      if (!window.Speech || !Speech.sttAvailable) return;
      mic.classList.add('rec');
      Speech.listen({
        onResult: (txt) => { mic.classList.remove('rec'); if (txt) { $('#userInput').value = txt; userSend(txt); } },
        onError: (e) => { mic.classList.remove('rec'); alert('语音识别：' + e); },
        onEnd: () => mic.classList.remove('rec'),
      });
    });
  }

        <h1>外教执行卡 · ${esc(sc.title)}</h1>
        <section class="block"><h3>Teacher says</h3><div class="callout">${esc(t.says || '')}</div></section>
        <section class="block"><h3>Students do</h3><div class="callout">${esc(t.do || '')}</div></section>
        <section class="block"><h3>Monitor（观察重点）</h3><div class="callout">${esc(t.monitor || '')}</div></section>
        <section class="block"><h3>Correction（纠错重点）</h3><div class="callout">${esc(t.correct || '')}</div></section>
        <section class="block"><h3>Success check（成功标准）</h3><div class="callout ok">${esc(t.success || '')}</div></section>
        <div class="actions"><button class="btn primary" id="back">‹ 返回情景</button></div>
      </div>`;
    $('#back').addEventListener('click', () => renderDetail(sc, 'library'));
  }

  /* ---------------- 视图：评价标准 ---------------- */
  function renderRubric(sc) {
    setActiveTab(''); showBack(true);
    const rows = (sc.rubric || []).map(r => `<tr><td>${esc(r.dim)}</td><td class="ok">${esc(r.ok)}</td><td class="need">${esc(r.need)}</td></tr>`).join('');
    $('#view').innerHTML = `
      <div class="detail">
        <h1>评价标准 · ${esc(sc.title)}</h1>
        <table class="tbl"><thead><tr><th>维度</th><th>达标</th><th>需要支持</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="actions"><button class="btn primary" id="back2">‹ 返回情景</button></div>
      </div>`;
    $('#back2').addEventListener('click', () => renderDetail(sc, 'library'));
  }

  /* 说明页：年级体系与三年级专项说明（避免三年级孩子被超纲语言劝退） */
  function g3Count() { return countByGrade('g3'); }

  function gradeSection() {
    const G = GRADES.g3;
    const rows = GRADE_OPTS.filter(g => g.id !== 'all' && g.id !== 'other').map(g => {
      const GG = GRADES[g.id];
      return `<tr><td>${esc(GG.zh)}</td><td>${esc(GG.age)}</td><td>${esc(GG.levels.join(' / '))}</td><td>${esc(GG.sentence)}</td><td>${countByGrade(g.id)}</td></tr>`;
    }).join('');
    return `
      <section class="block"><h3>年级体系与语言上限</h3>
        <p>每个情景都标注适用年级，并按年级限定<b>句长、生词量与互动轮次</b>。</p>
        <table class="tbl"><thead><tr><th>年级</th><th>年龄</th><th>难度区间</th><th>句长上限</th><th>情景数</th></tr></thead><tbody>${rows}</tbody></table>
      </section>
      <section class="block"><h3>小学三年级（英语起步年）</h3>
        <p>三年级是多数地区英语的<b>起点年</b>，语言必须压到最低。三年级情景统一遵守：</p>
        <ul>
          <li><b>句长</b>：${esc(G.sentence)}</li>
          <li><b>生词</b>：${esc(G.newWords)}；<b>互动</b>：${esc(G.rounds)}</li>
          <li><b>难度</b>：只用 ${esc(G.levels.join(' 与 '))}（S1 模仿表达 / S2 句框表达）</li>
          <li><b>词汇</b>：${esc(G.vocab)}</li>
          <li><b>禁止</b>：${esc(G.avoid.join('、'))}</li>
          <li><b>中文支架</b>：${esc(G.zhSupport)}</li>
        </ul>
        <p>话题按 <b>${esc(G.textbook)}</b> 编排，覆盖问候与自我介绍、颜色、身体部位、动物、食物与饮料、数字与年龄、家庭成员、方位介词、水果与喜好等。交际功能只保留三年级能承担的：询问信息、描述与确认、表达偏好、购买与点餐、解决简单问题。</p>
        <p>用云端大模型生成时，若选择三年级，上述约束会作为<b>最高优先级</b>写入提示词，模型返回的难度若越界也会被自动钳制回 ${esc(G.levels.join(' / '))}。</p>
      </section>`;
  }

  /* ---------------- 视图：说明 ---------------- */
  function renderAbout() {
    setActiveTab('about'); showBack(false);
    $('#view').innerHTML = `
      <div class="detail">
        <h1>使用说明</h1>
        <section class="block"><h3>这是什么</h3>
          <p>本应用把“背一段对话”改造成“必须听懂对方、做出选择并完成任务”的口语互动，遵循《英语口语情景对话生成器》方法论：每个情景都具备<b>信息差、角色目标、限制条件</b>三项中的至少两项。</p></section>
        <section class="block"><h3>三大模块</h3>
          <ul>
            <li><b>情景库</b>：共 ${SCENARIOS.length} 个完整情景包（12 节模板），其中<b>小学三年级 ${g3Count()} 个</b>，另有四~六年级 ${SCENARIOS.length - g3Count()} 个。</li>
            <li><b>智能生成·离线</b>：选年级+类别+功能+难度，离线生成全新情景包；选年级后难度会自动钳制在该年级区间。</li>
            <li><b>智能生成·云端</b>：在「智能生成 → 云端大模型生成」中填入 API Key 后，用自然语言描述主题/年级/句型，由大模型现场创作情景包。</li>
            <li><b>独立练习</b>：应用扮演其中一个角色，按脚本事实与你真实对话；可文字或语音输入，应用会用英语回复并朗读。</li>
          </ul></section>
        ${gradeSection()}
        <section class="block"><h3>关于 APK / 离线</h3>
          <p>本应用是<b>纯前端 PWA</b>，所有数据与对话逻辑均离线内置，无需联网、无需 API Key。在安卓 Chrome 中打开 → 菜单 → “添加到主屏幕”，即可像 App 一样全屏离线使用。</p>
          <p>如需安装包 <code>.apk</code>，可用本项目附带的 Cordova 工程打包（见 <code>build-apk.md</code>）：装好 Android Studio 与 Cordova 后执行 <code>cordova platform add android &amp;&amp; cordova build android</code> 即可生成签名 APK。</p></section>
        <section class="block"><h3>关于云端大模型生成</h3>
          <p>云端生成调用你配置的 OpenAI 兼容接口（支持 OpenAI / DeepSeek / Kimi / 通义千问 / 智谱 等）。API Key 仅保存在本机 <code>localStorage</code>，仅发往你所选的服务商，不会上传第三方。</p>
          <p>注意：① 浏览器直接调用大模型接口可能受跨域(CORS)限制；打包为安卓 APK 时本工程已放开网络权限，若仍报 CORS 建议用自有后端代理转发。② 每次生成会消耗对应账户的额度，请妥善保管 Key。</p>
        </section>
        <section class="block"><h3>隐私</h3>
          <p>不收集任何个人信息，不要求孩子透露家庭收入、住址、学校或联系方式。</p></section>
      </div>`;
  }

  /* ---------------- 视图：云端大模型设置 ---------------- */
  function renderSettings(from) {
    setActiveTab(''); showBack(true);
    const s = LLM.loadSettings();
    const provOpts = Object.keys(LLM.PROVIDERS).map(k => `<option value="${k}">${esc(LLM.PROVIDERS[k].label)}</option>`).join('');
    $('#view').innerHTML = `
      <div class="detail">
        <h1>云端大模型设置</h1>
        <p class="hint">生成「自由情景」需要调用大模型接口。请选择供应商并填入你的 API Key。Key 仅保存在本机（localStorage），仅发往你所选的服务商，不会上传任何第三方。</p>
        <div class="form">
          <label>供应商<select id="sProv">${provOpts}</select></label>
          <label>接口地址 Base URL<input id="sBase" type="text" placeholder="https://.../v1" value="${esc(s.base || '')}"></label>
          <label>API Key<input id="sKey" type="password" placeholder="sk-..." value="${esc(s.apiKey || '')}"></label>
          <label>模型名称<input id="sModel" type="text" placeholder="如 deepseek-chat" value="${esc(s.model || '')}"></label>
          <label class="full">创造性（温度） <span id="sTempVal">${s.temperature || 0.8}</span>
            <input id="sTemp" type="range" min="0" max="1" step="0.1" value="${s.temperature || 0.8}"></label>
          <div class="row">
            <button class="btn primary" id="sSave">💾 保存设置</button>
            <button class="btn" id="sBack">‹ 返回</button>
          </div>
        </div>
        <div class="tip">💡 提示：浏览器直接调用大模型接口可能遇到跨域(CORS)限制。本工程 config.xml 已放开 APK 网络权限；若仍报 CORS，建议把 Key 放在自己的后端代理里转发请求。</div>
      </div>`;
    if (s.provider && $(`#sProv option[value="${s.provider}"]`)) $('#sProv').value = s.provider;
    $('#sProv').addEventListener('change', () => {
      const p = LLM.PROVIDERS[$('#sProv').value];
      if (p) {
        if (!$('#sBase').value.trim()) $('#sBase').value = p.base || '';
        if (!$('#sModel').value.trim()) $('#sModel').value = p.model || '';
      }
    });
    $('#sTemp').addEventListener('input', () => { $('#sTempVal').textContent = $('#sTemp').value; });
    $('#sSave').addEventListener('click', () => {
      LLM.saveSettings({
        provider: $('#sProv').value,
        base: $('#sBase').value.trim(),
        apiKey: $('#sKey').value.trim(),
        model: $('#sModel').value.trim(),
        temperature: parseFloat($('#sTemp').value) || 0.8,
      });
      const tip = document.createElement('div'); tip.className = 'gen-banner'; tip.textContent = '✅ 已保存设置。';
      $('#view').appendChild(tip);
      setTimeout(() => { if (from === 'gen') renderGenerator(); else renderAbout(); }, 600);
    });
    $('#sBack').addEventListener('click', () => { if (from === 'gen') renderGenerator(); else renderAbout(); });
  }

  /* ---------------- 路由 ---------------- */
  const views = { home: renderHome, library: renderLibrary, gen: renderGenerator, about: renderAbout, settings: () => renderSettings('gen') };
  function go(view) { if (views[view]) views[view](); }

  /* ---------------- 启动 ---------------- */
  function init() {
    shell();
    go('home');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  // 暴露给控制台调试
  window.__app = {
    generateScenario, openScenario, renderGenerator, renderSettings, state,
    renderHome, renderLibrary, renderAbout, renderDetail, matchGrade, countByGrade,
  };
})();

</script>

  </script>
